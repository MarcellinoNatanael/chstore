<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Registrasi Admin — CHStore Dashboard</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login-admin.css">
  <link rel="stylesheet" href="css/register-admin.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="auth-brand-logo">
          <svg viewBox="0 0 14 17" width="22" height="22" fill="currentColor">
            <path d="M13.23 13.3c-.58.87-1.2 1.72-2.14 1.73-.94.02-1.24-.55-2.3-.55-1.07 0-1.4.54-2.29.57-.92.04-1.61-.92-2.2-1.77C2.97 11.9 2.06 8.71 3.29 6.57c.61-1.07 1.7-1.74 2.88-1.76.9-.01 1.75.61 2.3.61.55 0 1.58-.75 2.66-.64.45.02 1.73.18 2.55 1.39-.06.04-1.52.9-1.5 2.67.02 2.11 1.86 2.82 1.87 2.82-.02.05-.29 1.01-.97 1.98M9.1 2.45c.51-.58 1.36-1.02 2.06-1.05.09.82-.24 1.65-.73 2.23-.48.6-1.28 1.06-2.07.99-.1-.8.29-1.64.74-2.17z"/>
          </svg>
          <span class="auth-brand-name">CHStore</span>
          <span class="auth-brand-badge">ADMIN</span>
        </div>
        <p class="auth-brand-sub">Seller Dashboard</p>
      </div>

      <!-- Heading -->
      <h1 class="auth-title">Daftarkan Akun Admin</h1>
      <p class="auth-desc">Buat akun admin untuk mengelola toko</p>

      <!-- Alerts -->
      <div class="auth-alert" id="alertError" role="alert" aria-live="polite"></div>
      <div class="auth-alert auth-alert-success" id="alertSuccess" role="status" aria-live="polite"></div>

      <!-- Form -->
      <div class="form-group">
        <label class="form-label" for="fullName">
          Nama Lengkap <span class="form-required">*</span>
        </label>
        <input class="form-input" type="text" id="fullName"
          placeholder="Nama lengkap admin" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">
          Username <span class="form-required">*</span>
        </label>
        <input class="form-input" type="text" id="username"
          placeholder="username_admin" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">
          Email <span class="form-required">*</span>
        </label>
        <input class="form-input" type="email" id="email"
          placeholder="admin@chstore.id" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Kata Sandi <span class="form-required">*</span>
        </label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password"
            placeholder="Min. 8 karakter" autocomplete="new-password" required>
          <button class="toggle-pass" type="button" data-target="password" aria-label="Tampilkan kata sandi">
            <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="password-strength" id="passStrength" style="display:none">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-label" id="strengthLabel"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">
          Konfirmasi Kata Sandi <span class="form-required">*</span>
        </label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="confirmPassword"
            placeholder="Ulangi kata sandi" autocomplete="new-password" required>
          <button class="toggle-pass" type="button" data-target="confirmPassword" aria-label="Tampilkan kata sandi">
            <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-login" id="registerBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span id="registerBtnText">Buat Akun Admin</span>
      </button>

      <!-- Links -->
      <div class="auth-links">
        <span class="auth-link-muted-text">Sudah punya akun?
          <a href="login-admin.html" class="auth-link-primary">Masuk di sini</a>
        </span>
        <a href="https://marcellinonatanael.github.io/chstore" class="auth-link-muted">Kembali ke toko</a>
      </div>

    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/register-admin.js"></script>
</body>
</html>
